<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="/public/images/apliLogo.ico" type="image/x-icon">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;family=Noto+Serif+TC:wght@400;500;600&amp;display=swap">
        <link rel="stylesheet" href="/css/base/reset.css">
        <link rel="stylesheet" href="/css/base/tokens.css?v=20260903-text-body-token-v1">
        <link rel="stylesheet" href="/css/layout/site-header.css?v=20260904-header-hover-v3">
        <link rel="stylesheet" href="/css/layout/site-footer.css?v=20260830-polestar-footer-v15">
        <link rel="stylesheet" href="/css/components/buttons.css">
        <link rel="stylesheet" href="/css/pages/news-detail.css?v=20260904-news-detail-background-v6">
        <link rel="stylesheet" href="/css/site.css?v=20260902-page-hero-load-motion-v1">
    </head>
    <body class="news-detail-page">
        <div class="page-loader" data-page-loader role="status" aria-live="polite" aria-label="頁面載入中"></div>
        <a class="skip-link" href="#main-content">跳至主要內容</a>
        <header class="site-header">
            <div class="site-container site-header__inner">
                <a class="site-header__brand" href="/" aria-label="亞太國際物流首頁">
                    <img src="/public/images/logo/apli-logo.svg" alt="亞太國際物流標誌" loading="eager" decoding="sync">
                </a>
                <nav id="main-navigation" class="site-header__nav" aria-label="主選單">
                    <div class="nav-dropdown">
                        <button class="nav-link" type="button" aria-expanded="false" aria-controls="about-menu">
                            關於我們 <svg class="nav-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                        </button>
                        <div id="about-menu" class="nav-menu" role="group" aria-label="關於我們子選單">
                            <span class="nav-menu__title">關於亞太</span>
                            <a href="/about"><span>公司簡介</span></a>
                            <a href="/company-history"><span>公司沿革</span></a>
                            <a href="/operational-resources"><span>營運資源</span></a>
                            <a href="/future-outlook"><span>未來展望</span></a>
                        </div>
                    </div>
                    <div class="nav-dropdown">
                        <button class="nav-link" type="button" aria-expanded="false" aria-controls="services-menu">
                            服務項目 <svg class="nav-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                        </button>
                        <div id="services-menu" class="nav-menu" role="group" aria-label="服務項目子選單">
                            <span class="nav-menu__title">營業項目</span>
                            <a href="/services"><span>倉儲物流</span></a>
                            <a href="/services"><span>貨櫃清洗與維修</span></a>
                            <a href="/services"><span>機具維修與銷售</span></a>
                        </div>
                    </div>
                    <a href="/news" aria-current="page">最新消息</a>
                    <a href="/careers">人才招募</a>
                    <a href="/affiliates">關係企業</a>
                    <a href="/contact">聯絡我們</a>
                </nav>
                <div class="site-header__tools" aria-label="快速連結">
                    <a href="/contact" aria-label="前往聯絡我們頁面">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"></path></svg>
                    </a>
                    <a href="mailto:apadm@mail.apli.com.tw" aria-label="寄信給亞太國際物流">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 17V7A1.5 1.5 0 0 1 4 5.5Z"></path><path d="m3.5 7 8.5 6 8.5-6"></path></svg>
                    </a>
                </div>
                <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation">
                    <svg class="menu-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path class="menu-toggle__menu" d="M4 6h16M4 12h16M4 18h16"></path>
                        <path class="menu-toggle__close" d="m6 6 12 12M18 6 6 18"></path>
                    </svg>
                    <span class="sr-only">開啟選單</span>
                </button>
            </div>
        </header>
        <main id="main-content">
            <div class="news-breadcrumb page-breadcrumb">
                <div class="site-container">
                    <a href="/">首頁</a>
                    <span aria-hidden="true">›</span>
                    <a href="/news">最新消息</a>
                    <span aria-hidden="true">›</span>
                    <span aria-current="page"><!-- news-detail-breadcrumb --></span>
                </div>
            </div>
            <p class="news-detail-error site-container" data-news-error hidden>
                找不到這則最新消息，請返回<a href="/news">最新消息列表</a>。
            </p>
            <article class="news-detail site-container news-detail-image-state" data-news-detail>
                <a class="news-detail__back button--primary" href="/news">
                    <i class="ph ph-arrow-u-up-left" aria-hidden="true"></i>
                    <span>返回最新消息</span>
                </a>
                <header class="news-detail__header">
                    <div class="news-detail__meta">
                        <time data-news-date><!-- news-detail-date --></time>
                        <span data-news-tag><!-- news-detail-tag --></span>
                    </div>
                    <h1 data-news-title><!-- news-detail-title --></h1>
                </header>
                <div class="news-detail__layout">
                    <div class="news-detail__body">
                        <div class="news-detail__content" data-news-content><!-- news-detail-content --></div>
                        <div class="news-detail__attachment" data-news-attachment-wrap hidden>
                            <p class="news-detail__attachment-heading">附件：</p>
                            <a class="news-detail__attachment-link" data-news-attachment target="_blank" rel="noopener">
                                <i class="ph ph-paperclip" aria-hidden="true"></i>
                                <span data-news-attachment-name></span>
                            </a>
                        </div>
                    </div>
                    <!-- news-detail-media -->
                </div>
            </article>
        </main>
        <footer class="site-footer">
            <!-- shared-site-footer -->
        </footer>

        <script src="/js/site.js?v=20260902-page-hero-load-motion-v1"></script>
        <script src="/js/pages/news-detail.js?v=20260904-news-detail-content-image-v1"></script>
    </body>
</html>
